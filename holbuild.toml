[holbuild]
schema = 2
minimum_version = "0.12.0"

[project]
name = "rectraces"

[dependencies.hol]
git = "https://github.com/HOL-Theorem-Prover/HOL.git"
# HOL4 tag trindemossen-2-v9
rev = "652d1f0aad5cd537ed1e5d470ba3444e70ba470e"

# First-order logic syntax and semantics from HOL's
# examples/logic/folcompactness, which has no holbuild manifest of its own
[dependencies.hol_folcompactness]
from = "hol"
path = "examples/logic/folcompactness"
manifest = "shims/hol_folcompactness.toml"

[build]
members = ["hol", "hol/verif", "hol/fol", "hol/vc"]
# about 10x the slowest proof step (15.6 s in vcEval, November 2026)
tactic_timeout = 150.0
